name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore backend/SoftwareServicePlatform.Api/SoftwareServicePlatform.Api.csproj

      - name: Build backend
        run: dotnet build backend/SoftwareServicePlatform.Api/SoftwareServicePlatform.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: forntend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: forntend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  windows-clients:
    name: Updater Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Updater
        run: dotnet build clients/SoftwareServicePlatform.Updater/SoftwareServicePlatform.Updater.csproj --configuration Release

      - name: Build UpdaterBootstrap
        run: dotnet build clients/SoftwareServicePlatform.UpdaterBootstrap/SoftwareServicePlatform.UpdaterBootstrap.csproj --configuration Release
